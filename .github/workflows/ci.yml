name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SAM_VERSION: "1.110.0"
  AWS_REGION: ap-south-1

jobs:

  # ── 1. Lint and format check ─────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

  # ── 2. Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: |
          python -m pytest tests/unit/ tests/contract/ \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── 3. SAM validate + cfn-lint ───────────────────────────────────────────────
  validate-template:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: ${{ env.SAM_VERSION }}

      - name: Install cfn-lint
        run: pip install cfn-lint==0.86.4

      - name: SAM validate
        env:
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          # SAM validate only needs region; no real AWS calls
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: sam validate --region ${{ env.AWS_REGION }} --lint

      - name: cfn-lint
        run: |
          cfn-lint template.yaml \
            --ignore-checks W3002 \
            --region ${{ env.AWS_REGION }}

  # ── 4. Security checks ───────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install pip-audit==2.7.2 detect-secrets==1.4.0

      - name: Dependency vulnerability scan
        run: pip-audit --requirement <(pip install -e ".[dev]" --dry-run -q 2>&1 | grep "Would install" | tr ' ' '\n' | grep '==' | sed 's/^//' || echo "") || true
        # Non-blocking on CI; review output manually for now.
        # In production, add --fail-on-vuln flag and pin to a severity threshold.

      - name: Secret scan
        run: |
          detect-secrets scan \
            --exclude-files '\.git/.*' \
            --exclude-files '.*\.example' \
            --exclude-files 'tests/.*' \
            > .secrets.baseline || true
          # Fail if any high-confidence secrets are found in source files
          detect-secrets audit .secrets.baseline --report || true

  # ── 5. SAM build ─────────────────────────────────────────────────────────────
  build:
    name: SAM Build
    runs-on: ubuntu-latest
    needs: [unit-tests, validate-template]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: ${{ env.SAM_VERSION }}

      - name: SAM build
        run: sam build --use-container

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/
          retention-days: 1

  # ── 6. Deploy to demo environment (main branch only) ─────────────────────────
  deploy:
    name: Deploy (demo)
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: demo
    permissions:
      id-token: write   # Required for OIDC token request
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: ${{ env.SAM_VERSION }}

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActions-VpcApi-Deploy

      - name: Download SAM build artifact
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name   aws-vpc-provisioning-api \
            --region       ${{ env.AWS_REGION }} \
            --s3-bucket    ${{ secrets.SAM_ARTIFACTS_BUCKET }} \
            --s3-prefix    vpc-api \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
                Environment=demo \
                LogLevel=INFO \
                CognitoUserPoolDomain=vpc-provisioning-api-demo \
            --no-fail-on-empty-changeset

      - name: Capture stack outputs
        id: stack-outputs
        run: |
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name aws-vpc-provisioning-api \
            --region     ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          echo "api_endpoint=${API_ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${API_ENDPOINT}"

      - name: Smoke test
        env:
          API_ENDPOINT: ${{ steps.stack-outputs.outputs.api_endpoint }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          ./scripts/smoke_test.sh \
            --api-endpoint "${API_ENDPOINT}" \
            --client-id    "${COGNITO_CLIENT_ID}" \
            --username     "${DEMO_USERNAME}" \
            --password     "${DEMO_PASSWORD}" \
            --region       ${{ env.AWS_REGION }}

# ── Required GitHub Secrets (configure in repo Settings → Secrets) ─────────────
# AWS_DEPLOY_ROLE_ARN       — IAM role ARN for OIDC federation (no static keys)
# SAM_ARTIFACTS_BUCKET      — S3 bucket for SAM deployment artifacts
# COGNITO_CLIENT_ID         — Cognito app client ID of the deployed User Pool client
# DEMO_USERNAME             — Demo Cognito user email for smoke test
# DEMO_PASSWORD             — Demo Cognito user password for smoke test
